<script>try{var m=localStorage.getItem('bp_theme_mode'),s=localStorage.getItem('bp_theme_scheme');document.documentElement.setAttribute('data-mode',m==='dark'?'dark':'light');document.documentElement.setAttribute('data-scheme',['bluegreen','blueviolet','tealsky','violetpink','amberrose','slate'].indexOf(s)>=0?s:'bluegreen');}catch(e){document.documentElement.setAttribute('data-mode','light');document.documentElement.setAttribute('data-scheme','bluegreen');}</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="app">
  <header class="bar" id="bar">
    <a class="brand" href="#brief" aria-label="Business Pulse, home">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" class="mark-bg"/><path d="M4.5 15h4.4l2.3-6 3.6 11 2.6-8.2 1.5 3.2h4.6" class="mark-line"/></svg>
      <span class="brand-t"><b>Business Pulse</b><small>North Country photo, video &amp; drone</small></span>
    </a>
    <nav class="seg" id="nav" role="tablist" aria-label="Sections">
      <i class="thumb" aria-hidden="true"></i>
      <button role="tab" data-v="brief">Brief</button>
      <button role="tab" data-v="market">Market</button>
      <button role="tab" data-v="map">Map</button>
      <button role="tab" data-v="trends">Trends</button>
      <button role="tab" data-v="ai">AI Visibility</button>
      <button role="tab" data-v="data">Data</button>
    </nav>
    <div class="bar-r">
      <button class="chip" id="health" type="button" aria-label="Data freshness"><span class="dot"></span><span id="health-t">Checking</span></button>
      <button type="button" class="topen" data-topen aria-haspopup="dialog" aria-expanded="false" title="Theme: mode and gradient"><span class="tpdot" data-s="bluegreen"></span>Theme</button>
    </div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <aside id="drawer" aria-label="Details" aria-hidden="true"></aside>
