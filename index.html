<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Pulse · North Country photo market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=766fda4c">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="map" aria-hidden="true"></div>
<section id="rankings" hidden aria-label="Rankings"></section>

<header id="topbar" class="glass">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◈</span>
    <div class="brand-text"><h1>Business Pulse</h1><small>North Country photo market</small></div>
  </div>
  <div class="filters" role="search">
    <input id="fq" type="search" placeholder="Search businesses…" autocomplete="off" aria-label="Search businesses">
    <select id="flane" aria-label="Filter by lane">
      <option value="">All lanes</option>
      <option value="photo">Photo</option>
      <option value="video">Video</option>
      <option value="both">Photo + Video</option>
      <option value="drone">Drone</option>
    </select>
    <select id="fmom" aria-label="Filter by momentum">
      <option value="">Any momentum</option>
      <option value="gaining">Gaining</option>
      <option value="active">Active</option>
      <option value="quiet">Quiet</option>
      <option value="dormant">Dormant</option>
    </select>
    <select id="freg" aria-label="Filter by region">
      <option value="">All regions</option>
      <option value="slc">St. Lawrence Co</option>
      <option value="adjacent">Nearby counties</option>
      <option value="unconfirmed">Unconfirmed</option>
    </select>
  </div>
  <div class="top-actions">
    <div class="modetoggle" role="tablist" aria-label="Dataset">
      <button data-mode="businesses" class="on" role="tab" aria-selected="true">Businesses</button>
      <button data-mode="venues" role="tab" aria-selected="false">Venues</button>
    </div>
    <div class="viewtoggle" role="tablist" aria-label="Background view">
      <button data-view="map" class="on" role="tab" aria-selected="true">Map</button>
      <button data-view="rankings" role="tab" aria-selected="false">Rankings</button>
    </div>
    <div id="fresh" aria-label="Data freshness"></div>
    <span id="buildtag" title="Deployed build">build 65471d23 &middot; Sep 30 10:56 UTC</span>
  </div>
</header>

<aside id="left" class="glass panel" aria-label="Market panel">
  <button id="sheetgrab" aria-label="Expand or collapse panel"><span></span></button>
  <nav class="tabs" role="tablist" aria-label="Panel sections">
    <button data-tab="today" class="on" role="tab" aria-selected="true">Today</button>
    <button data-tab="dir" role="tab" aria-selected="false">Directory</button>
    <button data-tab="market" role="tab" aria-selected="false">Market</button>
    <button data-tab="ai" role="tab" aria-selected="false">AI Search</button>
    <button data-tab="data" role="tab" aria-selected="false">Data</button>
  </nav>
  <div id="leftbody"></div>
</aside>

<aside id="right" class="glass panel" aria-label="Detail panel">
  <button id="rightclose" aria-label="Close detail panel">×</button>
  <div id="rightbody"></div>
</aside>

<footer id="scrub" class="glass" aria-label="Time scrubber">
  <button id="playbtn" aria-label="Replay daily updates">▶</button>
  <input id="time" type="range" min="0" max="0" step="1" value="0" aria-label="Scrub through daily data">
  <span id="timelabel"></span>
  <span id="freshnote"></span>
</footer>

<div id="toast" role="status"></div>

<script src="data/data.js?v=28d268cc"></script>
<script src="data/website-intel.js?v=8b116b0d"></script>
<script src="data/venues.js?v=64107b26"></script>
<script src="data/details-enrichment.js?v=58ec6f51"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="app.js?v=65471d23"></script>
</body>
</html>
