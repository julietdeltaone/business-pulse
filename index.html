<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Pulse | JD Meyers Productions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/pulse">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span class="brand-text"><b>Business Pulse</b><small>JD Meyers Productions</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot" id="freshness"></div>
  </aside>
  <main class="main" id="main">
    <section class="view" id="view-pulse"></section>
    <section class="view" id="view-network"></section>
    <section class="view" id="view-roster"></section>
    <section class="view" id="view-market"></section>
    <section class="view" id="view-ai"></section>
    <section class="view" id="view-sweeps"></section>
    <section class="view" id="view-intake"></section>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1">
  <button class="drawer-close" id="drawerClose" aria-label="Close details">Close</button>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
