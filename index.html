<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Pulse — Competitor Intel Dashboard</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brandrow">
    <div class="mark">BP</div>
    <div>
      <h1>Business Pulse</h1>
      <div class="sub">JD Meyers Productions &middot; competitor intelligence</div>
    </div>
  </div>
  <div class="daterow">
    <div class="today" id="todayDate">&nbsp;</div>
    <div class="badge" id="dataBadge">syncing data&hellip;</div>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button class="tab active" data-view="overview">Overview</button>
  <button class="tab" data-view="ig">Competitor IG Trends</button>
  <button class="tab" data-view="jd">JD vs Competitors</button>
  <button class="tab" data-view="sweep">Website Sweeps</button>
  <button class="tab" data-view="ai">AI Visibility</button>
  <button class="tab" data-view="directory">Directory</button>
</nav>
<main>
  <div class="loading" id="loading"><div class="spin"></div>Loading pulse data&hellip;</div>
  <section class="view active" id="view-overview"></section>
  <section class="view" id="view-ig"></section>
  <section class="view" id="view-jd"></section>
  <section class="view" id="view-sweep"></section>
  <section class="view" id="view-ai"></section>
  <section class="view" id="view-directory"></section>
</main>
<footer>Business Pulse &middot; auto-synced every morning after the digest (~7:54 AM ET) &middot; sources: competitor sweeps, IG snapshots, AI audits</footer>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
